spring:
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: community
                          uri: ${COMMUNITY_URL:http://localhost:8080}
                          predicates:
                              - Path=/cidadao/api/v1/**,/ong/api/v1/**
                        - id: ocorrencias
                          uri: ${OCORRENCIAS_URL:http://localhost:8082}
                          predicates:
                              - Path=/ocorrencia/api/v1/**
