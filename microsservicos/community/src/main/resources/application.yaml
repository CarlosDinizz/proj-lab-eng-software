server:
    port: 8083
    address: 127.0.0.1
    shutdown: graceful
    servlet:
        context-path: /community

spring:
    application:
        name: community

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        hikari:
            maximum-pool-size: 5
            minimum-idle: 1
            connection-timeout: 2000
            validation-timeout: 1000
    lifecycle:
        timeout-per-shutdown-phase: 30s

supets:
    jwt:
        segredo: ${JWT_SECRET}
        expiracao: ${JWT_EXPIRACAO:2h}
