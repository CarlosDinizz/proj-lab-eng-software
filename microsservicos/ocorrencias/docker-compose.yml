services:
    # Container do banco
    ocorrencias_db:
        container_name: ocorrencias_db
        image: postgres:16-alpine3.23
        restart: always
        environment:
            POSTGRES_PASSWORD: ${PG_PASSWORD:-root}
            POSTGRES_USER: ${PG_USER:-root}
            POSTGRES_DB: ocorrencias
        volumes:
            - data:/var/lib/postgresql/data
        networks:
            - supets_network

volumes:
    data:
        name: "ocorrencias_data"

# Rede que o container utiliza
networks:
    supets_network:
        driver: bridge
        name: "supets_network"



