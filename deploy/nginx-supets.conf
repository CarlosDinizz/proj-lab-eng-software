# Front-end estático em / e proxy para o gateway (8081). Só a porta 80 fica aberta para fora.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/supets;
    index index.html;

    location /community/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Atenção: "/ocorrencia/" (API, singular) não colide com "/ocorrencias/..." (rotas do front).
    location /ocorrencia/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    # Rotas do React Router (ex.: /ocorrencias/nova) voltam para o index.html.
    location / {
        try_files $uri /index.html;
    }
}
